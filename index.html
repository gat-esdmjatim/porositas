<style>
  html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(168deg,#CFE0DE,#DED8CA);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1F3236}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .35s}
  #app.ready{opacity:1}
  #splash{position:fixed;inset:0;display:grid;place-items:center;text-align:center;transition:opacity .35s}
  #splash.gone{opacity:0;pointer-events:none}
  #splash b{display:block;font-size:24px;letter-spacing:.08em;margin-top:14px}
  #splash small{display:block;margin-top:4px;color:#4B6064}
  .lvl{animation:f 1.6s ease-in-out infinite}
  @keyframes f{0%{transform:translateY(40px)}60%{transform:translateY(0)}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.lvl{animation:none}}
</style>
</head>
<body>
<div id="splash">
  <div>
    <svg width="46" height="62" viewBox="0 0 46 62" aria-hidden="true"><defs><clipPath id="c"><path d="M23 2C23 2 3 25 3 39a20 20 0 0 0 40 0C43 25 23 2 23 2z"/></clipPath></defs>

      <path d="M23 2C23 2 3 25 3 39a20 20 0 0 0 40 0C43 25 23 2 23 2z" fill="none" stroke="#1E6B70" stroke-width="2"/></svg>

  </div>
</div>
<iframe id="app" title="POROSITAS" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<script>
  // Ganti dengan URL Web App Google Apps Script (akhiran /exec)
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbwzvSI3d2Ddt1TJrgvGnQa82kQmqAmCNOraiDvAq6cpgyHT3JabUpUf2W_SrURtFAZIQQ/exec';
  var f = document.getElementById('app');
