<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POROSITAS | Bidang Geologi dan Air Tanah</title>
<meta name="description" content="POROSITAS - Portal Otomasi Rekap dan Olah Surat Tugas serta Administrasi Pertanggungjawaban, Bidang Geologi dan Air Tanah Dinas ESDM Provinsi Jawa Timur.">
<meta name="theme-color" content="#0E8A91">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(168deg,#CFE0DE,#DED8CA);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1F3236}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .35s}
  #app.ready{opacity:1}
  #splash{position:fixed;inset:0;display:grid;place-items:center;text-align:center;transition:opacity .35s}
  #splash.gone{opacity:0;pointer-events:none}
  #splash b{display:block;font-size:24px;letter-spacing:.08em;margin-top:14px}
  #splash small{display:block;margin-top:4px;color:#4B6064}
  #splash img{animation:p 1.6s ease-in-out infinite}
  @keyframes p{50%{opacity:.55}}
  @media (prefers-reduced-motion:reduce){#splash img{animation:none}}
</style>
</head>
<body>
<div id="splash">
  <div>
    <img src="favicon.png" alt="Dinas ESDM Provinsi Jawa Timur" width="72" height="72">
    <b>POROSITAS</b><small>Bidang Geologi dan Air Tanah, Dinas ESDM Provinsi Jawa Timur</small>
  </div>
</div>
<iframe id="app" title="POROSITAS" allow="microphone; clipboard-read; clipboard-write; fullscreen; web-share"></iframe>
<script>
  // Ganti dengan URL Web App Google Apps Script (akhiran /exec)
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbwEHxZ_2rF3ZxMjEXkLT7Mqdmcnebpt8Ko3bvL-8XesvF_ONU4qcIFo2JiEIdq-Aoq-rA/exec';
  var f = document.getElementById('app');
  f.addEventListener('load', function () {
    f.classList.add('ready');
    document.getElementById('splash').classList.add('gone');
  });
  f.src = GAS_URL;
</script>
<script src="rekam.js?v=4"></script>
</body>
</html>
